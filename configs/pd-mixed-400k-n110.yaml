    - {engine_id: codex-po-2, url: http://127.0.0.1:8002}
    - {engine_id: codex-po-3, url: http://127.0.0.1:8003}
    - {engine_id: codex-po-4, url: http://127.0.0.1:8004}
    - {engine_id: codex-po-5, url: http://127.0.0.1:8005}
    - {engine_id: codex-po-6, url: http://127.0.0.1:8006}
    - {engine_id: codex-po-7, url: http://127.0.0.1:8007}
scheduler:
  model: Qwen3-30B-A3B
  model_tp_size: 1
  perf_window_s: 300
output_root: results/codex-po
