# Half-load validation: deterministic 110-session subset, same replay shape.
name: codex-pd-mixed-400k-n110
trace: traces/codex/steady_warm1200_measure600_n110_seed42.jsonl
policy: cache_aware
seed: 42
mode: replay
prime_shared_prefix: true
model: Qwen3-30B-A3B
